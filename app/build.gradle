plugins { id 'com.android.application' }
android {
    namespace 'com.aabhix.camera'
    compileSdk 36
    defaultConfig { applicationId 'com.aabhix.camera'; minSdk 29; targetSdk 35; versionCode 11; versionName '0.11.0'; testInstrumentationRunner 'com.aabhix.camera.validation.CameraValidation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }




